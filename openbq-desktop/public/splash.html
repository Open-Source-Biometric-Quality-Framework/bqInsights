<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #ffffff 0%, #ced7f0 100%);
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  text-align: center;
  animation: fadeIn 0.5s ease-in;
}

.app-name {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tagline {
  font-size: 14px;
  color: rgba(20, 19, 19, 0.6);
  margin-bottom: 40px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.loading-text {
  font-size: 15px;
  color: rgba(9, 9, 9, 0.8);
  margin-bottom: 20px;
}

.spinner {
  margin: 0 auto;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(102, 126, 234, 0.2);
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.footer-info {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(11, 11, 11, 0.4);
  text-align: center;
}

.version {
  margin-bottom: 4px;
}

.debug {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  color: rgba(12, 12, 12, 0.3);
  text-align: right;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>
  <div class="container">
   <img width="400" src="../public/logo.png">
    <div class="tagline" id="tagline">Analyse biometric data quality at scale.</div>
    <div class="loading-text">Starting application…</div>
    <div class="spinner"></div>
  </div>

  <div class="footer-info">
    <div class="version" id="version">v0.1.11</div>
    <!-- <div id="copyright"></div>
    <div>Licence: <a id="licencelink"><span id="licence"></span></a></div> -->
  </div>

  <div class="debug" id="debug">Loading...</div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const debug = document.getElementById('debug');
      debug.textContent = 'DOM Ready';

      if (window.electron?.getAppInfo) {
        try {
          debug.textContent = 'Fetching info...';
          const info = await window.electron.getAppInfo();
          debug.textContent = `BQInsights v${info.version}`;

          const setText = (id, value) => {
            const el = document.getElementById(id);
            if (el && value) el.textContent = value;
          };

          setText('appName', info.appname);
          setText('version', info.version ? `v${info.version}` : '');
          setText('tagline', info.description);

          if (info.company) {
            const year = new Date().getFullYear();
            setText('copyright', `© ${year} ${info.company}`);
          }
          if (info.licence) {
            setText('licence', info.licence.name);
            const licenceLink = document.getElementById('licencelink');
            if (licenceLink && info.licence.link) licenceLink.href = info.licence.link;
          }
        } catch (error) {
          debug.textContent = `Error: ${error.message}`;
        }
      }
    });
  </script>
</body>
</html>
