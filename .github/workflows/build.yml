name: Build

on:
  workflow_call:
  workflow_dispatch:

env:
  BUN_VERSION: "1.4.4"
  CI: "true"

jobs:
  # ──────────────── Build Linux ────────────────
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenBQ
        run: bun run build:openbq

      - name: Package Linux (.deb)
        run: bun --filter=openbq-desktop run dist:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: openbq-linux
          path: openbq-desktop/release/*.deb
          if-no-files-found: error

  # ──────────────── Build Windows ────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenBQ
        run: bun run build:openbq

      - name: Package Windows (.exe)
        run: bun --filter=openbq-desktop run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: openbq-windows
          path: openbq-desktop/release/*.exe
          if-no-files-found: error

  # ──────────────── Build macOS ────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenBQ
        run: bun run build:openbq

      - name: Package macOS (.dmg)
        run: bun --filter=openbq-desktop run dist:unsigned

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: openbq-macos
          path: openbq-desktop/release/*.dmg
          if-no-files-found: error
