# ──────────────── Create GitLab Release ────────────────

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: upload-windows
    - job: upload-linux
    # - job: upload-macos
    #   optional: true
  script:
    - echo "Generating native GitLab release for ${CI_COMMIT_TAG}"
  release:
    name: 'OpenBQ Desktop v${CI_COMMIT_TAG}'
    description: 'OpenBQ Desktop release ${CI_COMMIT_TAG}'
    tag_name: '${CI_COMMIT_TAG}'
    ref: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'OpenBQ-${CI_COMMIT_TAG}-win.exe'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openbq-desktop/${CI_COMMIT_TAG}/OpenBQ-${CI_COMMIT_TAG}-win.exe'
        - name: 'OpenBQ-${CI_COMMIT_TAG}-linux.deb'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openbq-desktop/${CI_COMMIT_TAG}/OpenBQ-${CI_COMMIT_TAG}-linux.deb'
        # - name: 'OpenBQ-${CI_COMMIT_TAG}-mac.dmg'
        #   url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openbq-desktop/${CI_COMMIT_TAG}/OpenBQ-${CI_COMMIT_TAG}-mac.dmg'
