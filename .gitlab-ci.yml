stages:
  - test
  - build
  - upload
  - release

# ──────────────── Initialisation & Cache ────────────────

variables:
  BUN_VERSION: "1.4.4"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

.build_template:
  stage: build
  image: oven/bun:${BUN_VERSION}
  variables:
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/
      - node_modules/
  artifacts:
    expire_in: 30d

# ──────────────── Security Scans ────────────────

# Runs on branch commits and on tags
secret_detection:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Runs when tagged ("everything runs on tag")
semgrep-sast:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'

# ──────────────── Build Jobs ────────────────

build-linux:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_TAG'
      # when: manual
      # allow_failure: true
  before_script:
    - apt-get update && apt-get install -y python3 build-essential
    - bun install --frozen-lockfile
  script:
    - bun run build:openbq
    - bun --filter=openbq-desktop run dist:linux
  artifacts:
    paths:
      - openbq-desktop/release/*.deb

build-windows:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - dpkg --add-architecture i386 && apt-get update && apt-get install -y wine64 libwine:i386 python3 build-essential
    - bun install --frozen-lockfile
  script:
    - bun run build:openbq
    - bun --filter=openbq-desktop run dist:win
  artifacts:
    paths:
      - openbq-desktop/release/*.exe

