# ──────────────── Upload Jobs ────────────────

upload-linux:
  stage: upload
  image: curlimages/curl:latest # Swapped node image for light curl image since node isn't needed here
  rules:
    - if: '$CI_COMMIT_TAG'
      allow_failure: true
  needs:
    - job: build-linux
      optional: true
  script:
    - |
      FILENAME=$(find openbq-desktop/release/ -maxdepth 1 -name "*.deb" -type f | head -1)
      if [ -z "$FILENAME" ]; then echo "Linux build skipped or no package found." && exit 0; fi
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$FILENAME" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openbq-desktop/${CI_COMMIT_TAG}/$(basename "$FILENAME")"

upload-windows:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - build-windows
  script:
    - |
      FILENAME=$(find openbq-desktop/release/ -maxdepth 1 -name "*.exe" -type f | head -1)
      if [ -z "$FILENAME" ]; then echo "ERROR: No .exe found!" && exit 1; fi
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$FILENAME" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openbq-desktop/${CI_COMMIT_TAG}/$(basename "$FILENAME")"

